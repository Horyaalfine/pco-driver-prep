{% extends "base.html" %}
{% block title %}Log in — {{ app_name }}{% endblock %}
{% block content %}
<h1>Log in</h1>
<form class="stack" method="post">
  <div>
    <label for="email">Email</label>
    <input type="email" id="email" name="email" required autofocus>
  </div>
  <div>
    <label for="password">Password</label>
    <input type="password" id="password" name="password" required>
  </div>
  <label><input type="checkbox" name="remember" style="width:auto;display:inline-block;margin-right:6px;"> Remember me</label>
  <button class="btn btn-accent" type="submit">Log in</button>
</form>
<p><a href="{{ url_for('auth.forgot_password') }}">Forgot your password?</a></p>
<p>No account yet? <a href="{{ url_for('auth.register') }}">Create one</a></p>
{% endblock %}
